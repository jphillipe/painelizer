# Deploy do Panelizer no Cloud Run a cada push na main (docs/12-hospedagem-cloud-run.md, seção 7).
# Testes e typecheck primeiro; se falharem, nada vai para o ar. O login no Google é sem chave (Workload
# Identity Federation): o pool só aceita tokens deste repositório na main — scripts/setup-github-deploy.ps1.
#
# O deploy só troca o código. Variáveis, segredo, memória e acesso público ficam como estão no serviço: o
# Cloud Run copia a configuração da revisão anterior. Para mudá-los, rode scripts/deploy-cloud-run.ps1.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy de cada vez; um push novo espera o anterior terminar em vez de cancelá-lo no meio.
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  PROJECT: national-lumber-1883b
  REGION: us-east1
  SERVICE: panelizer
  WIF_PROVIDER: projects/603903016131/locations/global/workloadIdentityPools/github/providers/github
  DEPLOY_SA: github-deploy@national-lumber-1883b.iam.gserviceaccount.com

jobs:
  check:
    name: Tests and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    name: Cloud Run
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      # Cloud Build constrói a imagem pelo Dockerfile da raiz; uns 5 a 8 minutos.
      - run: gcloud run deploy "$SERVICE" --source . --project "$PROJECT" --region "$REGION" --quiet
      # /api/health diz se a chave da Anthropic e o Supabase chegaram ao processo e qual revisão responde.
      - name: Health
        run: |
          url=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.url)')
          health=$(curl -fsS --retry 3 --retry-delay 10 "$url/api/health")
          echo "$health"
          echo "$health" | jq -e '.ai and .auth' > /dev/null || { echo "::error::A chave da Anthropic ou o Supabase não chegaram ao processo."; exit 1; }
