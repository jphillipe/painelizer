# Deploy do Panelizer no Cloud Run a cada push na main (docs/12-hospedagem-cloud-run.md, seção 7).
# Lint, typecheck, testes e `next build` primeiro (o mesmo do ci.yml); se falharem, nada vai para o ar. O login no
# Google é sem chave (Workload Identity Federation): o pool só aceita tokens deste repositório na main —
# scripts/setup-github-deploy.ps1.
#
# O deploy só troca o código. Variáveis, segredo, memória e acesso público ficam como estão no serviço: o
# Cloud Run copia a configuração da revisão anterior. Para mudá-los, rode scripts/deploy-cloud-run.ps1.
#
# Rollback (S27): se o /api/health da revisão nova falhar, o tráfego volta inteiro para a revisão que servia
# antes do deploy. A revisão nova fica criada (sem tráfego) para olhar os logs.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy de cada vez; um push novo espera o anterior terminar em vez de cancelá-lo no meio.
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  PROJECT: national-lumber-1883b
  REGION: us-east1
  SERVICE: panelizer
  WIF_PROVIDER: projects/603903016131/locations/global/workloadIdentityPools/github/providers/github
  DEPLOY_SA: github-deploy@national-lumber-1883b.iam.gserviceaccount.com

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter web build

  deploy:
    name: Cloud Run
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      # A revisão que está no ar agora: o alvo do rollback.
      - name: Current revision
        id: previous
        run: |
          rev=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.latestReadyRevisionName)')
          echo "Revisão no ar antes do deploy: ${rev:-nenhuma}"
          echo "revision=$rev" >> "$GITHUB_OUTPUT"
      # Cloud Build constrói a imagem pelo Dockerfile da raiz; uns 5 a 8 minutos. Se a revisão nova não sobe, o
      # próprio deploy falha e o tráfego nem sai da anterior.
      - run: gcloud run deploy "$SERVICE" --source . --project "$PROJECT" --region "$REGION" --quiet
      # Depois de um rollback o tráfego fica preso numa revisão; sem isto, a revisão nova não receberia nada.
      - name: Traffic to latest
        run: gcloud run services update-traffic "$SERVICE" --to-latest --project "$PROJECT" --region "$REGION" --quiet
      # /api/health diz se a chave da Anthropic e o Supabase chegaram ao processo e qual revisão responde.
      - name: Health
        id: health
        run: |
          url=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.url)')
          latest=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.latestReadyRevisionName)')
          health=$(curl -fsS --retry 3 --retry-delay 10 --retry-all-errors "$url/api/health")
          echo "$health"
          echo "$health" | jq -e '.ai and .auth' > /dev/null || { echo "::error::A chave da Anthropic ou o Supabase não chegaram ao processo."; exit 1; }
          echo "$health" | jq -e --arg rev "$latest" '.revision == $rev' > /dev/null || { echo "::error::O health respondeu de outra revisão, não da $latest."; exit 1; }
      - name: Rollback
        if: failure() && steps.health.outcome == 'failure' && steps.previous.outputs.revision != ''
        env:
          PREVIOUS: ${{ steps.previous.outputs.revision }}
        run: |
          gcloud run services update-traffic "$SERVICE" --to-revisions="$PREVIOUS=100" --project "$PROJECT" --region "$REGION" --quiet
          echo "::error::Health falhou; tráfego de volta para $PREVIOUS. O próximo deploy devolve o tráfego à revisão mais nova."
