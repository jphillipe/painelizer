# Checagem de PR e de branch (S27): o mesmo que o deploy exige antes de ir para o ar, sem deploy. A main é
# checada pelo deploy.yml (job `check`), por isso fica fora daqui.

name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

# Um push novo na mesma branch/PR cancela a checagem anterior, que já não vale.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Erro de build (rota, import de servidor no cliente, config do Next) aparecia só no Cloud Build.
      - run: pnpm --filter web build
